# MIX IT continuous integration.
#  - windows: the product platform (MSVC engine + native tests, .NET solution
#    incl. the WPF app, xUnit tests, mixit-probe smoke test)
#  - linux-devhost: sanitizers (ASan/UBSan, TSan), MinGW cross-check, xUnit
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The managed VST3 tests must find the test plug-in built with the native tests.
  MIXIT_REQUIRE_VST3_TEST_BUNDLE: "1"

jobs:
  windows:
    name: Windows (MSVC + .NET)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fetch pinned LGPL FFmpeg (BtbN/FFmpeg-Builds)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # Pinned: tag + SHA-256 of ffmpeg-n9.0.2-57-gd838f9f9ae-win64-lgpl-shared-9.0.zip
        run: ./scripts/fetch-ffmpeg-windows.ps1 -Tag autobuild-2026-11-16-15-29 -Sha256 bc661777e3aeb29cbd9e68f8b29a4ea1b54cc0db0373ff447085e5cb4ef307b3 -Destination build/ffmpeg
      - name: Build and test
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Configuration Debug
      # The Release build and its smoke/self-tests run on every push; the
      # downloadable package was held back until M9 (owner decision 2026-11-19).
      # M9 is reached (0.9.0 preview): package and installer are published on
      # every successful run; set the repository variable
      # MIXIT_PUBLISH_PACKAGE=false to stop publishing.
      - name: Release build (self-contained) and smoke/self-test MixIt.exe
        shell: pwsh
        env:
          # Publisher key for licence verification (public; set by the owner). Empty = Free-only build.
          MIXIT_LICENSE_PUBLIC_KEY: ${{ vars.MIXIT_LICENSE_PUBLIC_KEY }}
        run: ./scripts/package-windows.ps1 -Output artifacts/MixIt-win-x64
      - name: Installer (Inno Setup) — build and silent install/uninstall test
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Upload installer
        if: ${{ vars.MIXIT_PUBLISH_PACKAGE != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: MixIt-Setup-${{ github.sha }}
          path: artifacts/MixIt-Setup-*.exe
          if-no-files-found: error
      - name: Upload MixIt-win-x64 package
        if: ${{ vars.MIXIT_PUBLISH_PACKAGE != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: MixIt-win-x64-${{ github.sha }}
          path: artifacts/MixIt-win-x64
          if-no-files-found: error
          retention-days: 30
      - name: Upload app logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-logs
          path: ~/AppData/Local/MixIt/logs
          if-no-files-found: ignore
      - name: Upload native test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ctest-log
          path: build/windows-msvc/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  linux-devhost:
    name: Linux dev host (sanitizers, MinGW cross-check)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev libgmock-dev g++-mingw-w64-x86-64-posix \
                                  pkg-config libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev
      - name: Allow sanitizers on high-entropy ASLR kernels
        # TSan/ASan abort with "unexpected memory mapping" when mmap_rnd_bits > 28.
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Verify
        run: ./scripts/verify-linux.sh --mingw
