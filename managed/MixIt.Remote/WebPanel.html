<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIX IT — Remote</title>
<style>
  :root { color-scheme: dark; --bg:#121417; --panel:#1c2026; --line:#2b313a; --text:#e6e9ee; --dim:#8b94a3; --pgm:#d3333a; --pvw:#2e9e4f; --acc:#3d7bd9; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header b { letter-spacing: .08em; }
  #status { color: var(--dim); margin-left: auto; }
  main { padding: 16px; display: grid; gap: 16px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
  h2 { margin: 0 0 10px; font-size: 11px; letter-spacing: .1em; color: var(--dim); font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  button { background: #262c35; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; font: inherit; cursor: pointer; min-width: 64px; }
  button:active { background: var(--acc); }
  button.big { font-weight: 700; padding: 14px 22px; }
  .tile { min-width: 120px; text-align: left; }
  .tile small { display: block; color: var(--dim); }
  .tile.pgm { border-color: var(--pgm); box-shadow: inset 0 0 0 2px var(--pgm); }
  .tile.pvw { border-color: var(--pvw); box-shadow: inset 0 0 0 2px var(--pvw); }
  #login { max-width: 420px; }
  input { width: 100%; padding: 10px; background: #0e1013; color: var(--text); border: 1px solid var(--line); border-radius: 4px; font: inherit; }
  #log { color: var(--dim); font-size: 12px; min-height: 1.4em; }
</style>
</head>
<body>
<header><b>MIX IT</b><span>Remote</span><span id="status">not connected</span></header>
<main>
  <section id="login">
    <h2>ACCESS TOKEN</h2>
    <p style="color:var(--dim);margin-top:0">Shown in MIX IT → Automation → Remote control.</p>
    <input id="token" type="password" autocomplete="off" placeholder="token">
    <div class="row" style="margin-top:8px"><button id="connect">Connect</button></div>
  </section>
  <section id="panel" hidden>
    <h2>INPUTS — click: preview · double-click: program</h2>
    <div class="row" id="inputs"></div>
  </section>
  <section id="switch" hidden>
    <h2>SWITCHING</h2>
    <div class="row">
      <button class="big" data-cmd="Cut">CUT</button>
      <button class="big" data-cmd="Auto">AUTO</button>
      <button data-cmd="OverlayToggle" data-args='{"channel":"1"}'>OVL 1</button>
      <button data-cmd="OverlayToggle" data-args='{"channel":"2"}'>OVL 2</button>
      <button data-cmd="OverlayToggle" data-args='{"channel":"3"}'>OVL 3</button>
      <button data-cmd="OverlayToggle" data-args='{"channel":"4"}'>OVL 4</button>
    </div>
  </section>
  <section id="macrosec" hidden>
    <h2>MACROS</h2>
    <div class="row" id="macros"></div>
  </section>
  <div id="log"></div>
</main>
<script>
"use strict";
const base = "/api/v1";
let token = sessionStorage.getItem("mixit-token") || "";
let socket = null;
const $ = id => document.getElementById(id);
$("token").value = token;

function log(text) { $("log").textContent = text; }

async function call(path, options = {}) {
  const r = await fetch(base + path, { ...options, headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" } });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || r.status);
  return body;
}

async function command(name, args = {}) {
  try {
    await call("/commands/" + encodeURIComponent(name), { method: "POST", body: JSON.stringify({ args }) });
    log(name + " ✓");
  } catch (e) { log(name + ": " + e.message); }
}

function renderTally(entries) {
  const box = $("inputs");
  box.replaceChildren();
  for (const e of entries) {
    const b = document.createElement("button");
    b.className = "tile" + (e.program ? " pgm" : e.preview ? " pvw" : "");
    b.textContent = e.number + "  " + e.name;
    const s = document.createElement("small");
    s.textContent = e.program ? "PROGRAM" : e.preview ? "PREVIEW" : "";
    b.appendChild(s);
    b.onclick = () => command("SetPreview", { input: "id:" + e.inputId });
    b.ondblclick = () => command("SetProgram", { input: "id:" + e.inputId });
    box.appendChild(b);
  }
}

async function loadMacros() {
  const macros = await call("/macros");
  const box = $("macros");
  box.replaceChildren();
  for (const m of macros) {
    const b = document.createElement("button");
    b.textContent = m.name;
    b.onclick = () => command("RunMacro", { name: m.name });
    box.appendChild(b);
  }
  $("macrosec").hidden = macros.length === 0;
}

async function connect() {
  token = $("token").value.trim();
  try {
    const state = await call("/state");
    sessionStorage.setItem("mixit-token", token);
    $("login").hidden = true;
    for (const id of ["panel", "switch"]) $(id).hidden = false;
    renderTally(state.tally);
    await loadMacros();
    openEvents();
  } catch (e) { log("Connect failed: " + e.message); }
}

function openEvents() {
  const proto = location.protocol === "https:" ? "wss://" : "ws://";
  socket = new WebSocket(proto + location.host + base + "/events?token=" + encodeURIComponent(token));
  socket.onopen = () => { $("status").textContent = "connected"; };
  socket.onclose = () => { $("status").textContent = "disconnected — retrying"; setTimeout(openEvents, 2000); };
  socket.onmessage = m => {
    const ev = JSON.parse(m.data);
    if (ev.type === "tally") renderTally(ev.data);
    else if (ev.type === "state") renderTally(ev.data.tally);
  };
}

document.querySelectorAll("[data-cmd]").forEach(b =>
  b.addEventListener("click", () => command(b.dataset.cmd, b.dataset.args ? JSON.parse(b.dataset.args) : {})));
$("connect").onclick = connect;
$("token").addEventListener("keydown", e => { if (e.key === "Enter") connect(); });
if (token) connect();
</script>
</body>
</html>
